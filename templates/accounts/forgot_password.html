{% load static %}
<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password — VillageConnect</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/custom.css' %}">
    <style>
        .step-transition {
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        .dev-badge {
            background: rgba(25, 135, 84, 0.15);
            border: 1px solid rgba(25, 135, 84, 0.35);
            color: #75b798;
            cursor: pointer;
            transition: all 0.2s;
        }
        .dev-badge:hover {
            background: rgba(25, 135, 84, 0.25);
            color: #a3cfbb;
        }
    </style>
</head>
<body>
<div class="auth-container">
    <div class="auth-card fade-in-up">
        <!-- Brand Header -->
        <div class="brand-logo text-center mb-4">
            <div class="icon-wrapper mx-auto mb-2"><i class="bi bi-shield-lock-fill"></i></div>
            <h3 class="fw-bold mb-1">Reset Password</h3>
            <p class="text-muted small" id="headerSubtitle">Verify your phone number to set a new password</p>
        </div>

        <!-- Alert messages -->
        <div id="alert-box" class="alert d-none small py-2 mb-3" role="alert"></div>

        <!-- STEP 1: Phone Number -->
        <div id="step1-container" class="step-transition">
            <form id="step1Form" onsubmit="return handleSendOtp(event)">
                <div class="mb-4">
                    <label class="form-label small fw-semibold">Registered Phone Number</label>
                    <div class="input-group">
                        <span class="input-group-text bg-dark border-secondary text-muted">+91</span>
                        <input type="tel" class="form-control vc-form-control" id="phone" placeholder="Enter 10-digit number" maxlength="10" pattern="[0-9]{10}" required autocomplete="tel">
                    </div>
                    <div class="form-text text-muted small">We will send a 6-digit OTP to this number.</div>
                </div>

                <button type="submit" class="btn btn-vc w-100 py-2 fw-semibold d-flex align-items-center justify-content-center gap-2" id="sendOtpBtn">
                    <span id="sendOtpSpinner" class="spinner-border spinner-border-sm d-none"></span>
                    <i class="bi bi-chat-left-dots-fill" id="sendOtpIcon"></i>
                    <span>Send Verification OTP</span>
                </button>
            </form>
        </div>

        <!-- STEP 2: OTP & New Password -->
        <div id="step2-container" class="step-transition d-none">
            <div class="p-3 bg-dark border border-secondary border-opacity-25 rounded mb-3 d-flex justify-content-between align-items-center">
                <div>
                    <div class="text-muted small">OTP sent to:</div>
                    <div class="fw-bold text-light" id="displayPhone">+91 ----------</div>
                </div>
                <button type="button" class="btn btn-sm btn-outline-secondary py-0 px-2 small" onclick="backToStep1()">
                    Change
                </button>
            </div>

            <!-- Dev mode OTP helper banner -->
            <div id="devOtpBanner" class="p-2 rounded mb-3 dev-badge small text-center d-none" onclick="autoFillDevOtp()" title="Click to auto-fill OTP">
                <i class="bi bi-lightning-fill me-1"></i>
                <span>Test Mode OTP: <strong id="devOtpVal"></strong> (Click to auto-fill)</span>
            </div>

            <form id="step2Form" onsubmit="return handleVerifyAndReset(event)">
                <!-- 6-digit OTP -->
                <div class="mb-3">
                    <div class="d-flex justify-content-between align-items-center mb-1">
                        <label class="form-label small fw-semibold mb-0">6-Digit OTP</label>
                        <span id="timerText" class="text-muted small">10:00</span>
                    </div>
                    <input type="text" class="form-control vc-form-control text-center letter-spacing-2 fw-bold fs-5" id="otp" placeholder="• • • • • •" maxlength="6" pattern="[0-9]{6}" required autocomplete="one-time-code">
                </div>

                <!-- New Password -->
                <div class="mb-3">
                    <label class="form-label small fw-semibold">New Password</label>
                    <div class="input-group">
                        <input type="password" class="form-control vc-form-control" id="newPassword" placeholder="Minimum 4 characters" minlength="4" required>
                        <button class="btn btn-outline-secondary border-secondary text-muted" type="button" onclick="togglePasswordVisibility('newPassword', this)">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>

                <!-- Confirm Password -->
                <div class="mb-4">
                    <label class="form-label small fw-semibold">Confirm New Password</label>
                    <div class="input-group">
                        <input type="password" class="form-control vc-form-control" id="confirmPassword" placeholder="Re-enter new password" minlength="4" required>
                        <button class="btn btn-outline-secondary border-secondary text-muted" type="button" onclick="togglePasswordVisibility('confirmPassword', this)">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn btn-vc w-100 py-2 fw-semibold d-flex align-items-center justify-content-center gap-2 mb-3" id="resetBtn">
                    <span id="resetSpinner" class="spinner-border spinner-border-sm d-none"></span>
                    <i class="bi bi-check2-circle" id="resetIcon"></i>
                    <span>Set New Password</span>
                </button>

                <div class="text-center">
                    <button type="button" class="btn btn-link text-muted small p-0 text-decoration-none" id="resendBtn" onclick="resendOtp()">
                        <i class="bi bi-arrow-clockwise me-1"></i>Resend OTP
                    </button>
                </div>
            </form>
        </div>

        <!-- Footer Links -->
        <div class="text-center mt-4 pt-3 border-top border-secondary border-opacity-25">
            <span class="text-muted small">Remember your password?</span>
            <a href="/login/" class="text-accent fw-600 text-decoration-none small ms-1">
                <i class="bi bi-box-arrow-in-right me-1"></i>Back to Sign In
            </a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
let currentPhone = '';
let latestDevOtp = '';

function showAlert(message, type = 'danger') {
    const box = document.getElementById('alert-box');
    box.className = `alert alert-${type} small py-2 mb-3`;
    box.innerHTML = message;
    box.classList.remove('d-none');
}

function hideAlert() {
    document.getElementById('alert-box').classList.add('d-none');
}

// Step 1: Send OTP
async function handleSendOtp(e) {
    e.preventDefault();
    hideAlert();

    const phone = document.getElementById('phone').value.trim();
    if (!phone || phone.length !== 10) {
        showAlert('Please enter a valid 10-digit phone number.');
        return;
    }

    const btn = document.getElementById('sendOtpBtn');
    const spinner = document.getElementById('sendOtpSpinner');
    const icon = document.getElementById('sendOtpIcon');

    btn.disabled = true;
    spinner.classList.remove('d-none');
    icon.classList.add('d-none');

    try {
        const response = await fetch('/api/auth/forgot-password/send-otp', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ phone }),
        });

        const data = await response.json();

        if (response.ok) {
            currentPhone = phone;
            document.getElementById('displayPhone').textContent = '+91 ' + phone;

            // Check if devOtp was provided (in development)
            if (data.devOtp) {
                latestDevOtp = data.devOtp;
                document.getElementById('devOtpVal').textContent = data.devOtp;
                document.getElementById('devOtpBanner').classList.remove('d-none');
            } else {
                document.getElementById('devOtpBanner').classList.add('d-none');
            }

            showAlert(data.message || 'OTP sent successfully!', 'success');

            // Switch to Step 2
            document.getElementById('step1-container').classList.add('d-none');
            document.getElementById('step2-container').classList.remove('d-none');
            document.getElementById('headerSubtitle').textContent = 'Enter the 6-digit code sent to your phone';
            document.getElementById('otp').focus();
        } else {
            showAlert(data.error || 'Failed to send OTP. Please check your number.');
        }
    } catch (err) {
        console.error(err);
        showAlert('Network error. Please make sure the server is running.');
    } finally {
        btn.disabled = false;
        spinner.classList.add('d-none');
        icon.classList.remove('d-none');
    }
}

// Step 2: Verify OTP & Reset
async function handleVerifyAndReset(e) {
    e.preventDefault();
    hideAlert();

    const otp = document.getElementById('otp').value.trim();
    const newPassword = document.getElementById('newPassword').value;
    const confirmPassword = document.getElementById('confirmPassword').value;

    if (!otp || otp.length !== 6) {
        showAlert('Please enter the 6-digit OTP.');
        return;
    }

    if (newPassword.length < 4) {
        showAlert('Password must be at least 4 characters long.');
        return;
    }

    if (newPassword !== confirmPassword) {
        showAlert('Passwords do not match. Please re-enter.');
        return;
    }

    const btn = document.getElementById('resetBtn');
    const spinner = document.getElementById('resetSpinner');
    const icon = document.getElementById('resetIcon');

    btn.disabled = true;
    spinner.classList.remove('d-none');
    icon.classList.add('d-none');

    try {
        const response = await fetch('/api/auth/forgot-password/verify-and-reset', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                phone: currentPhone,
                otp: otp,
                newPassword: newPassword,
            }),
        });

        const data = await response.json();

        if (response.ok) {
            showAlert(`<strong>Success!</strong> ${data.message} Redirecting to login...`, 'success');
            setTimeout(() => {
                window.location.href = '/login/';
            }, 1800);
        } else {
            showAlert(data.error || 'Failed to reset password.');
            btn.disabled = false;
            spinner.classList.add('d-none');
            icon.classList.remove('d-none');
        }
    } catch (err) {
        console.error(err);
        showAlert('Network error. Please try again.');
        btn.disabled = false;
        spinner.classList.add('d-none');
        icon.classList.remove('d-none');
    }
}

function autoFillDevOtp() {
    if (latestDevOtp) {
        document.getElementById('otp').value = latestDevOtp;
        document.getElementById('newPassword').focus();
    }
}

function resendOtp() {
    document.getElementById('step1Form').dispatchEvent(new Event('submit'));
}

function backToStep1() {
    hideAlert();
    document.getElementById('step2-container').classList.add('d-none');
    document.getElementById('step1-container').classList.remove('d-none');
    document.getElementById('headerSubtitle').textContent = 'Verify your phone number to set a new password';
}

function togglePasswordVisibility(inputId, btn) {
    const input = document.getElementById(inputId);
    const icon = btn.querySelector('i');
    if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'bi bi-eye-slash';
    } else {
        input.type = 'password';
        icon.className = 'bi bi-eye';
    }
}
</script>
</body>
</html>
