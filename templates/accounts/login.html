{% load static %}
<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — VillageConnect</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/custom.css' %}">
</head>
<body>
<div class="auth-container">
    <div class="auth-card fade-in-up">
        <div class="brand-logo">
            <div class="icon-wrapper"><i class="bi bi-tree-fill"></i></div>
            <h3 class="fw-bold mb-1">Welcome Back</h3>
            <p class="text-muted small">Sign in to VillageConnect</p>
        </div>

        <div id="login-error" class="alert alert-danger d-none small py-2"></div>

        <form id="loginForm" onsubmit="return handleLogin(event)">
            <div class="mb-3">
                <label class="form-label">Phone Number</label>
                <div class="input-group">
                    <span class="input-group-text" style="background: var(--vc-bg); border-color: var(--vc-border); color: var(--vc-text-muted);">+91</span>
                    <input type="tel" class="form-control vc-form-control" id="phone" placeholder="Enter 10-digit number" maxlength="10" required>
                </div>
            </div>
            <div class="mb-4">
                <div class="d-flex justify-content-between align-items-center mb-1">
                    <label class="form-label mb-0">Password</label>
                    <a href="/forgot-password/" class="text-accent text-decoration-none small">Forgot Password?</a>
                </div>
                <input type="password" class="form-control vc-form-control" id="password" placeholder="Enter password" required>
            </div>
            <button type="submit" class="btn btn-vc w-100 py-2" id="loginBtn">
                <span id="loginSpinner" class="spinner-border spinner-border-sm d-none me-2"></span>
                Sign In
            </button>
        </form>

        <div class="text-center mt-4">
            <span class="text-muted small">Don't have an account?</span>
            <a href="/register/" class="text-accent fw-600 text-decoration-none small ms-1">Register</a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{% static 'js/auth.js' %}"></script>
<script>
    // Redirect if already logged in
    if (Auth.isAuthenticated()) {
        window.location.href = '/dashboard/';
    }

    async function handleLogin(e) {
        e.preventDefault();
        const phone = document.getElementById('phone').value.trim();
        const password = document.getElementById('password').value;
        const errorEl = document.getElementById('login-error');
        const btn = document.getElementById('loginBtn');
        const spinner = document.getElementById('loginSpinner');

        errorEl.classList.add('d-none');
        btn.disabled = true;
        spinner.classList.remove('d-none');

        try {
            const resp = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phone, password }),
            });
            const data = await resp.json();

            if (resp.ok) {
                Auth.saveAuth(data);
                window.location.href = '/dashboard/';
            } else {
                errorEl.textContent = data.error || 'Invalid credentials';
                errorEl.classList.remove('d-none');
            }
        } catch (err) {
            errorEl.textContent = 'Network error. Please try again.';
            errorEl.classList.remove('d-none');
        } finally {
            btn.disabled = false;
            spinner.classList.add('d-none');
        }
    }
</script>
</body>
</html>
